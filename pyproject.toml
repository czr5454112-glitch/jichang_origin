[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "czr005"
version = "0.1.0"
description = "JunctionShield-MARL airport ICS baggage routing research stack"
requires-python = ">=3.11"
dependencies = [
  "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

