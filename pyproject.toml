[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "czr005"
version = "0.1.0"
description = "JunctionShield-MARL airport ICS baggage routing research stack"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "zstandard>=0.23",
]

[project.optional-dependencies]
research = [
  "pandas>=2.2",
  "pyarrow>=16,<22",
  "scikit-learn>=1.5",
  "scipy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

