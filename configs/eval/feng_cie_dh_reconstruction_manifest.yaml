mechanics:
  tick_seconds: 0.2
  speed_mps: 2.5
  movement_per_tick_m: 0.5
  reconstructed_transfer_stage_seconds: 2.0
  reconstructed_transfer_stage_status: FROZEN_HISTORICAL_OD_LOWER_ENVELOPE_INFERENCE_NOT_PAPER_EXPLICIT
  transfer_stage_scope: >-
    source fixed 2.0 s per-bag nonexclusive induction; at each non-goal
    intermediate node, map throughTime is a locally exclusive junction stage
    that retains the upstream edge footprint, followed by a per-bag
    nonexclusive fixed 2.0 s timer after the upstream footprint is released;
    timer completion enters the physical outgoing-edge FIFO; goal service is zero
  source_induction:
    duration_seconds: 2.0
    capacity_semantics: per_bag_nonexclusive_timer_then_physical_outgoing_entry_fifo
    evidence: historical_25_one_bag_OD_lower_envelopes_only
  intermediate_handoff:
    map_through_time_seconds_on_map2: 1.0
    map_through_capacity_semantics: graph_node_local_exclusive
    map_through_occupancy_semantics: retain_upstream_edge_footprint_as_STOPPED
    post_through_transfer_seconds: 2.0
    post_through_transfer_capacity_semantics: per_bag_nonexclusive_overlapping_timer
    post_through_occupancy_semantics: upstream_edge_footprint_released
    post_timer_admission_semantics: physical_outgoing_edge_entry_FIFO
  goal_service_seconds: 0.0
  evidence_limits:
    demo3d_transferduration: NOT_ACCEPTED_AS_VALIDATION_EVIDENCE
    unavailable_DH_source_state_machine: NOT_RECOVERED
  footprint_definition: ceil((agv_length_m + safe_length_m) / movement_per_tick_m)
  update: snapshot_plan_conflict_resolution_simultaneous_commit
  state_space:
    - NOT_RELEASED
    - AT_LOADING_OR_JUNCTION
    - MOVING_ON_EDGE
    - STOPPED_ON_EDGE
    - COMPLETED
  merge_tie_break:
    - arrival_tick_at_node
    - task_release_tick
    - task_id
    - upstream_edge_id

routing:
  free_flow_cost: edge_length / speed_mps
  occupancy_source: tick-start physical positions on the candidate continuation path
  score: free_flow_time + alpha_seconds * moving_count + beta_seconds * stopped_count
  hold: selected edge entry blocked by a physically stopped bag
  coefficients:
    disclosure_status: COEFFICIENTS_UNDISCLOSED_SENSITIVITY_REPORTED
    physical_anchor: (agv_length_m + safe_length_m) / speed_mps
    primary:
      alpha_scale: 1.0
      beta_over_alpha: 2.0
    sensitivity:
      alpha_scales: [0.5, 1.0, 2.0]
      beta_over_alpha: [1.5, 2.0, 3.0]
    frozen_before_formal_run: true
    paper_table_used_as_tuning_target: false

