    table53_seconds: {min: 206.4, mean: 238.702287238, p95: 285.2, p99: 300.8, max: 326.0}
  observation_unit: raw_bag
  historical_regression_denominator: full_28506_raw_bag_population
  start_timestamp: frozen_shared_schedule_D
  end_timestamp: segment_completion_E
  two_segment_aggregation: sum_each_segment_completion_E_minus_shared_schedule_D
  ebs_scheduled_storage_wait_included: false
  source_wait_after_shared_schedule_D_included: true
  first_edge_admission_timestamp_used: false
  completion_population: all_28506_raw_bags
  identity_status: RECOVERED_EXACTLY_FROM_ORIGINAL_TABLE53_WORKBOOK_FORMULAS
  note: >-
    The original workbook computes each raw bag as the sum of segment E-D.
    The D schedule is byte-frozen and shared by the HCA and DH sheets; planned
    EBS storage gaps are therefore excluded, while any wait after D remains in
    the measured segment interval. First-admission timing is diagnostic only.

