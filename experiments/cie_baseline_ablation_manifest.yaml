schema: czr005.cie_baseline_ablation_manifest.v1
manifest_status: PREREGISTERED_PROTOCOL_NO_RESULTS
created_from_git_base: e58876320d6d72c185a702ef8a1e38b2fad7e344

scope:
  purpose: "Compare one literature-family adaptation and one frozen distributed route-only adaptation under a common runtime without survivor bias."
  existing_exploratory_outputs: NOT_FORMAL_PREREGISTERED_EVIDENCE
  result_fields_in_this_manifest: FORBIDDEN
  code_or_runner_change_authorized_by_this_manifest: false

method_registry:
  - method_id: HCA_NATIVE
    role: end_to_end_reference
    implementation_status: EXISTING
    included_in_formal_route_only_matrix: false
  - method_id: FENG_DH_REIMPLEMENTATION_COEFFICIENTS_UNDISCLOSED_NOT_EXACT
    role: baseline_a
    literature_family: TARAU_LOCAL_2009
    implementation_status: ADAPTED_BASELINE_EXISTING
    included_in_formal_route_only_matrix: true
    aliases:
      - TARAU_LOCAL_2009
      - CIE_DH_2009
      - CIE_DH_REPLICA
    count_as_independent_methods: 1
    executable_scorer_mode: FENG_DH_REIMPLEMENTATION_COEFFICIENTS_UNDISCLOSED
    coefficients:
      moving_weight: 1.0
      stopped_weight: 2.0
      provenance: FROZEN_ORDINAL_ADAPTATION_NOT_PUBLISHED_EXACT_COEFFICIENTS
    result_label_required: FENG_DH_REIMPLEMENTATION_COEFFICIENTS_UNDISCLOSED_NOT_EXACT
  - method_id: TARAU_DISTRIBUTED_2010_ADAPTED_ROUTE_ONLY
    role: baseline_b
    implementation_status: FROZEN_ADAPTATION_SPEC_NOT_EXACT
    included_in_formal_route_only_matrix: true
    exact_reproduction_status: BLOCKED
    adaptation_reproduction_status: ADAPTED_BASELINE_NOT_EXACT
    blockers:
      - mechanical_switch_state_and_flip_time_missing
      - five_offline_calibrated_weights_missing
      - eta_and_route_history_missing
    formula: "tau(u,v) + min_w(max(tau(v,w),(1+Npred(v,w,t;5s))/mu(w)) + Hff(w,g))"
    tau_pred_seconds: 5.0
    dynamic_information_radius: 2
    npred_projection:
      source: direct_neighbor_bounded_beacon
      fields: [live, arrive_within_5s, drain_by_service_rate]
      global_future_task_or_reservation_read: false
    switch_cost_seconds: 0.0
    merge_policy: NEUTRAL_FIFO
    eta_used: false
    route_history_used: false
    arbitrary_degree_rule: STABLE_ARGMIN_THEN_LOWEST_NODE_ID
    formula_freeze_status: FROZEN_BEFORE_ANY_FORMAL_RESULT
    formal_execution_allowed: AFTER_IMPLEMENTATION_AND_FORMAL_RUN_GATES_ONLY
  - method_id: S4_ROUTE_ONLY_NEUTRAL_FIFO
    role: proposed_route_policy_reference
    source_family: G31_S4
    implementation_status: COMMON_RUNTIME_CONFIGURATION_REQUIRED
    included_in_formal_route_only_matrix: true

excluded_methods:
  - method_id: SOHRT_PTW
    disposition: EXCLUDED_THIS_ROUND
    reason: full_path_handshake_architecture_incompatible_with_one_next_hop_common_runtime
  - method_id: SORENSEN_DSP_100
    disposition: RELATED_WORK_ONLY
    reason: not_one_of_the_two_new_literature_baselines

protocol:
  comparison_layer: P1_NEXT_HOP_ROUTE_ONLY
  formal_method_ids:
    - FENG_DH_REIMPLEMENTATION_COEFFICIENTS_UNDISCLOSED_NOT_EXACT
    - TARAU_DISTRIBUTED_2010_ADAPTED_ROUTE_ONLY
    - S4_ROUTE_ONLY_NEUTRAL_FIFO
  release_protocol: CANONICAL_SCHEDULED_ARRIVALS
  paired_input_requirement: SAME_MAP_TASK_POPULATION_SPEED_WINDOW_AND_SEED_FOR_ALL_METHODS
  stable_only: true
  dynamic_faults: false
  common_physical_invariants:
    - healthy_directed_edge_existence
    - physical_fault_edge_filter
    - R3_physical_service_feasibility_and_mutual_exclusion
    - terminal_completion_semantics
    - fixed_event_and_time_limits
  common_nonroute_control:
    source_admission: NEUTRAL_COMMON_RULE
    merge_policy: NEUTRAL_FIFO
  forbidden_information_transfer:
    - do_not_give_S4_service_calendar_features_to_literature_baselines
    - do_not_give_global_future_reservations_to_TARAU_DISTRIBUTED_2010_ADAPTED_ROUTE_ONLY

